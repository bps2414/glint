name: Servidor

# Backend Cloudflare (server/): typecheck + testes no runtime do Workers (Miniflare) e deploy.
# Só Linux e só quando server/ muda — não dispara o build Windows.
#
# Deploy: depois dos testes, se a variável DEPLOY_SERVER = true. Configuração (uma vez, em
# Settings → Secrets and variables → Actions; passo a passo em docs/DEPLOY.md):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DISCORD_CLIENT_SECRET
#   Variables: DEPLOY_SERVER=true, DISCORD_CLIENT_ID, ADMIN_DISCORD_IDS
# Para publicar sem mudar código: Actions → Servidor → último run → "Re-run all jobs".
on:
  push:
    branches: ["**"]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Servidor (typecheck + testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy na Cloudflare
    needs: test
    if: vars.DEPLOY_SERVER == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Um deploy por vez, sem cancelar um que já começou.
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          ADMIN_DISCORD_IDS: ${{ vars.ADMIN_DISCORD_IDS }}
