[package]
name = "app-platform-win"
description = "Backend Windows do app: captura WGC, conversão D3D11, áudio WASAPI, hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app-core.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
tray-icon = { version = "0.26", default-features = false }
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

# Só o exemplo carga-gpu (jogo sintético para medir o custo do gravador).
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_System_LibraryLoader",
] }
